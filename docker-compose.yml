services:
  tg-cidr:
    build: .
    restart: unless-stopped
    # Compose only passes the variables listed here. Set the values in Dokploy's
    # Environment tab (or a .env file); ${VAR:-default} is used when a value is not set.
    environment:
      # Lists to serve: telegram, google, apple
      PROVIDERS: ${PROVIDERS:-telegram,google,apple}
      # Optional secret path segment, e.g. "k3x9q2" -> https://cidr.example.com/k3x9q2/apple/v4.txt
      PATH_PREFIX: ${PATH_PREFIX:-}

      # Refresh intervals and expiry
      REFRESH_HOURS: ${REFRESH_HOURS:-24}
      RESOLVE_MINUTES: ${RESOLVE_MINUTES:-30}
      EXPIRE_DAYS: ${EXPIRE_DAYS:-90}

      # Learn Apple domains from your NextDNS logs (logging must be on for the profile).
      # Both are needed together.
      NEXTDNS_API_KEY: ${NEXTDNS_API_KEY:-}
      NEXTDNS_PROFILES: ${NEXTDNS_PROFILES:-}
      # How often to ask the logs API for new lookups (minutes; 0 = off)
      NEXTDNS_POLL_MINUTES: ${NEXTDNS_POLL_MINUTES:-1}
      # 1 = also follow the live stream. NextDNS closes it after ~20s and rate limits
      # reconnects, so it is off by default.
      NEXTDNS_STREAM: ${NEXTDNS_STREAM:-0}

      # Optional overrides; empty = built-in defaults
      APPLE_HOSTS: ${APPLE_HOSTS:-}
      TELEGRAM_URL: ${TELEGRAM_URL:-}
      GOOGLE_URL: ${GOOGLE_URL:-}
      APPLE_URL: ${APPLE_URL:-}

      # Enables POST /ingest/<provider> (see scripts/pfsense-ingest.sh); empty = off
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes:
      - tg-cidr-data:/data
    # No "ports:" needed. In Dokploy, add a Domain pointing at container port 8080.
    expose:
      - "8080"

volumes:
  tg-cidr-data:
